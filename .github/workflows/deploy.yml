name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Hugo (extended)
        run: |
          version="$(tr -d '[:space:]' < .hugo-version)"
          url="https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_extended_${version}_linux-amd64.deb"
          curl -sSLf -o /tmp/hugo.deb "$url"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Build
        run: hugo -s site -d ../dist --logLevel info --panicOnWarning

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
